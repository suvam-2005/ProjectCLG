<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>language_age13_v1</title>
<style>
  body { font-family: sans-serif; padding: 1.5em; }
  .target, .choice { display: inline-block; margin: 0.4em; padding: 0.6em 1em;
                       border: 1px solid #888; cursor: pointer; }
  #finish_button { margin-top: 1.5em; }
  #status { margin-top: 1em; font-weight: bold; }
</style>
</head>
<body>
  <p id="instructions">Click the word that is closest in meaning to &#x27;reluctant&#x27;, then click Finish.</p>
  <div id="stimulus"><p>word closest in meaning to &#x27;reluctant&#x27;</p></div>
  <div id="interactive_area"><button class="choice" id="choice_a" type="button">eager</button>
<button class="choice" id="choice_b" type="button">unwilling</button>
<button class="choice" id="choice_c" type="button">curious</button>
<button class="choice" id="choice_d" type="button">confident</button></div>
  <button id="finish_button" type="button">Finish</button>
  <div id="status" data-state="not_started">not_started</div>
  <script>
    const status = document.getElementById("status");
    document.querySelectorAll(".target, .choice").forEach((el) => {
      el.addEventListener("click", () => {
        status.dataset.state = "in_progress";
        status.textContent = "in_progress";
      });
    });
    document.getElementById("finish_button").addEventListener("click", () => {
      status.dataset.state = "completed";
      status.textContent = "completed";
    });
  </script>
</body>
</html>
