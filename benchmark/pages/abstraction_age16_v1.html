<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>abstraction_age16_v1</title>
<style>
  body { font-family: sans-serif; padding: 1.5em; }
  .target, .choice { display: inline-block; margin: 0.4em; padding: 0.6em 1em;
                       border: 1px solid #888; cursor: pointer; }
  #finish_button { margin-top: 1.5em; }
  #status { margin-top: 1em; font-weight: bold; }
</style>
</head>
<body>
  <p id="instructions">Each item below is grouped by TWO shared properties: being both man-made AND used for measurement. Click the choice that fits both properties, then click Finish.</p>
  <div id="stimulus"><p>ruler, thermometer, scale -&gt; both man-made and used for measurement. Which fits?</p></div>
  <div id="interactive_area"><button class="choice" id="choice_a" type="button">mountain</button>
<button class="choice" id="choice_b" type="button">clock</button>
<button class="choice" id="choice_c" type="button">tree</button>
<button class="choice" id="choice_d" type="button">cloud</button>
<button class="choice" id="choice_e" type="button">river</button></div>
  <button id="finish_button" type="button">Finish</button>
  <div id="status" data-state="not_started">not_started</div>
  <script>
    const status = document.getElementById("status");
    document.querySelectorAll(".target, .choice").forEach((el) => {
      el.addEventListener("click", () => {
        status.dataset.state = "in_progress";
        status.textContent = "in_progress";
      });
    });
    document.getElementById("finish_button").addEventListener("click", () => {
      status.dataset.state = "completed";
      status.textContent = "completed";
    });
  </script>
</body>
</html>
