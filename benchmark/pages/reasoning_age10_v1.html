<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>reasoning_age10_v1</title>
<style>
  body { font-family: sans-serif; padding: 1.5em; }
  .target, .choice { display: inline-block; margin: 0.4em; padding: 0.6em 1em;
                       border: 1px solid #888; cursor: pointer; }
  #finish_button { margin-top: 1.5em; }
  #status { margin-top: 1em; font-weight: bold; }
</style>
</head>
<body>
  <p id="instructions">Look at the pattern. Each step alternates adding 3 then adding 1. Click the choice that continues it, then click Finish.</p>
  <div id="stimulus"><p>1, 4, 5, 8, 9, ?</p></div>
  <div id="interactive_area"><button class="choice" id="choice_a" type="button">10</button>
<button class="choice" id="choice_b" type="button">11</button>
<button class="choice" id="choice_c" type="button">12</button>
<button class="choice" id="choice_d" type="button">13</button></div>
  <button id="finish_button" type="button">Finish</button>
  <div id="status" data-state="not_started">not_started</div>
  <script>
    const status = document.getElementById("status");
    document.querySelectorAll(".target, .choice").forEach((el) => {
      el.addEventListener("click", () => {
        status.dataset.state = "in_progress";
        status.textContent = "in_progress";
      });
    });
    document.getElementById("finish_button").addEventListener("click", () => {
      status.dataset.state = "completed";
      status.textContent = "completed";
    });
  </script>
</body>
</html>
