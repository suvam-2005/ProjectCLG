<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>visual_spatial_age13_v1</title>
<style>
  body { font-family: sans-serif; padding: 1.5em; }
  .target, .choice { display: inline-block; margin: 0.4em; padding: 0.6em 1em;
                       border: 1px solid #888; cursor: pointer; }
  #finish_button { margin-top: 1.5em; }
  #status { margin-top: 1em; font-weight: bold; }
</style>
</head>
<body>
  <p id="instructions">A square has its top-left corner marked. If the square is rotated 90 degrees counter-clockwise, then flipped horizontally, where is the marked corner now? Click your answer, then click Finish.</p>
  <div id="stimulus"><p>Marked corner: top-left. Rotate 90° counter-clockwise, then flip horizontally. New corner?</p></div>
  <div id="interactive_area"><button class="choice" id="choice_a" type="button">top-left</button>
<button class="choice" id="choice_b" type="button">top-right</button>
<button class="choice" id="choice_c" type="button">bottom-left</button>
<button class="choice" id="choice_d" type="button">bottom-right</button></div>
  <button id="finish_button" type="button">Finish</button>
  <div id="status" data-state="not_started">not_started</div>
  <script>
    const status = document.getElementById("status");
    document.querySelectorAll(".target, .choice").forEach((el) => {
      el.addEventListener("click", () => {
        status.dataset.state = "in_progress";
        status.textContent = "in_progress";
      });
    });
    document.getElementById("finish_button").addEventListener("click", () => {
      status.dataset.state = "completed";
      status.textContent = "completed";
    });
  </script>
</body>
</html>
