<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>reasoning_age13_v1</title>
<style>
  body { font-family: sans-serif; padding: 1.5em; }
  .target, .choice { display: inline-block; margin: 0.4em; padding: 0.6em 1em;
                       border: 1px solid #888; cursor: pointer; }
  #finish_button { margin-top: 1.5em; }
  #status { margin-top: 1em; font-weight: bold; }
</style>
</head>
<body>
  <p id="instructions">If a rule applies &#x27;double, then subtract 1&#x27; to get each next number, click the choice that continues the pattern, then click Finish.</p>
  <div id="stimulus"><p>3, 5, 9, 17, ?</p></div>
  <div id="interactive_area"><button class="choice" id="choice_a" type="button">25</button>
<button class="choice" id="choice_b" type="button">31</button>
<button class="choice" id="choice_c" type="button">33</button>
<button class="choice" id="choice_d" type="button">34</button></div>
  <button id="finish_button" type="button">Finish</button>
  <div id="status" data-state="not_started">not_started</div>
  <script>
    const status = document.getElementById("status");
    document.querySelectorAll(".target, .choice").forEach((el) => {
      el.addEventListener("click", () => {
        status.dataset.state = "in_progress";
        status.textContent = "in_progress";
      });
    });
    document.getElementById("finish_button").addEventListener("click", () => {
      status.dataset.state = "completed";
      status.textContent = "completed";
    });
  </script>
</body>
</html>
